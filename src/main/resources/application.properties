spring.application.name=cloudshop-api
server.port=8081
# server.shutdown=graceful
spring.jpa.properties.hibernate.globally_quoted_identifiers=true
spring.h2.console.enabled=true

spring.datasource.url=jdbc:postgresql://localhost:5432/cloudshopdb
spring.datasource.username=${POSTGRE_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.database=POSTGRESQL
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
#spring.datasource.url=jdbc:h2:mem:test
spring.jpa.show-sql=true
# auto create table
spring.jpa.hibernate.ddl-auto=update


# exposing all endpoints for actuator , '*' in yml
management.endpoints.web.exposure.include=*
# to show details info
management.endpoint.health.show-details=always
# exposing info under management
management.info.env.enabled=true
# enabling shutdown endpont, can be triggered by post req only
management.endpoint.shutdown.enabled=true

info.app.name= MyApp
info.description=App built by me
info.version=0.1.0